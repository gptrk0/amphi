# Builds and publishes the image anyone installs. Pushing to master moves `latest`; pushing a
# `v1.2.3` tag publishes `1.2.3`, `1.2` and `latest` alongside it, so a compose file can pin
# a version if it wants to and follow the head if it does not.

name: image

on:
    push:
        branches: [ master ]
        tags: [ "v*" ]
    workflow_dispatch:

permissions:
    contents: read
    # what lets GITHUB_TOKEN push to ghcr.io — no separate secret to keep
    packages: write

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            # arm64 is emulated on a x86 runner. It is the slow half of this job by a wide
            # margin — measured at 781s against 61s for the same builder stage — so drop it
            # from `platforms` below if a build every push matters more than the Raspberry Pi
            # and the arm Macs.
            #
            # Not `docker/setup-qemu-action`. That action does two things: it registers the
            # emulators, which is this line, and it then runs the same image a second time to
            # read back the list of platforms and parse it as JSON. The second half is
            # informational and it is the half that breaks on a self-hosted runner: the query
            # needs to read `/proc/sys/fs/binfmt_misc`, which a runner that is itself inside a
            # container usually cannot, and the empty answer surfaces as `Unexpected end of
            # JSON input` with nothing said about emulators at all. The install is what
            # matters, and it prints what it did.
            - name: Register the arm64 emulator
              run: docker run --rm --privileged tonistiigi/binfmt:latest --install arm64

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=semver,pattern={{version}}
                      type=semver,pattern={{major}}.{{minor}}
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha,format=short

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # the dependency install and the compile are the whole cost of this build,
                  # and neither changes on most pushes
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
