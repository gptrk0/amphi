services:
    aioseerr_app:
        container_name: aioseerr_app
        build:
            context: .
            dockerfile: Dockerfile
        stop_signal: SIGKILL
        ports:
            - ${APP_PORT}:3000
            - 5555:5555
        env_file:
            - ../.env
        volumes:
            - ..:/home/bun/app

    aioseerr_db:
        container_name: aioseerr_db
        image: postgres:17.7
        environment:
            POSTGRES_USER: ${DATABASE_USER}
            POSTGRES_PASSWORD: ${DATABASE_PASS}
            POSTGRES_DB: ${DATABASE_NAME}
        volumes:
            - postgres-data:/var/lib/postgresql/data

volumes:
    postgres-data:
